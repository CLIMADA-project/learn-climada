name: Deploy PR previews

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed  # To delete the preview

env:
  # pre-commit already checks that Lockfile is up-to-date
  UV_FROZEN: "1"

concurrency: preview-${{ github.ref }}

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      -
        uses: actions/checkout@v7
      -
        name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          prune-cache: true
      -
        name: Install dependencies
        run: |
          uv sync
      -
        name: Build HTML Assets
        run: uv run -- jupyter book build --html
        env:
          BASE_URL: /${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}/
      -
        name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
            source-dir: _build/html
            preview-branch: gh-pages
            qr-code: false
            wait-for-pages-deployment: true
